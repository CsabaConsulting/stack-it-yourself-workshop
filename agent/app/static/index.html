<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack It Yourself - workshop agent</title>
<style>
  :root { --bg:#0f1419; --panel:#161d25; --line:#243140; --text:#e6edf3; --muted:#8b9bb0; --accent:#4aa3ff; --user:#1f3a5a; --bot:#1b2631; --err:#5a1f24; --ok:#2ea043; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { margin:0 0 8px; font-size:17px; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; padding:2px 9px; border:1px solid var(--line); border-radius:999px; color:var(--muted); }
  .chip b { color:var(--text); font-weight:600; }
  main { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:760px; padding:10px 14px; border-radius:10px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--user); }
  .assistant { align-self:flex-start; background:var(--bot); border:1px solid var(--line); }
  .tool { align-self:flex-start; font:12px ui-monospace,Consolas,monospace; color:var(--muted); padding:2px 10px; border-left:2px solid var(--accent); }
  .error { align-self:flex-start; background:var(--err); border:1px solid #8b2c33; }
  .meta { display:block; margin-top:6px; font-size:12px; color:var(--muted); }
  .meta a { color:var(--accent); }
  .empty { color:var(--muted); text-align:center; margin-top:18vh; }
  footer { padding:12px 20px; border-top:1px solid var(--line); background:var(--panel); }
  form { display:flex; gap:8px; }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  button { padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:var(--accent); color:#04121f; font-weight:600; cursor:pointer; }
  button.secondary { background:transparent; color:var(--muted); }
  button:disabled { opacity:.5; cursor:wait; }
  .conv { margin-top:6px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Stack It Yourself &mdash; conference assistant</h1>
  <div class="chips" id="chips"><span class="chip">connecting&hellip;</span></div>
</header>
<main id="log"><div class="empty" id="empty">Ask about AGNTCon + MCPCon &mdash; try <i>&ldquo;What workshops are on Friday?&rdquo;</i></div></main>
<footer>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask the agent&hellip;" autofocus>
    <button id="send" type="submit">Send</button>
    <button id="new" type="button" class="secondary" title="Start a new conversation">New</button>
  </form>
  <div class="conv">conversation <code id="cid"></code></div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
let info = {};
let cid = localStorage.getItem("conversation_id") || newId();

function newId() { const id = crypto.randomUUID().replace(/-/g, "").slice(0, 12); localStorage.setItem("conversation_id", id); return id; }
function chip(label, value) { return `<span class="chip">${label} <b>${value}</b></span>`; }

function traceLink(traceId) {
  if (!traceId || !info.grafana_url) return "";
  const panes = { a: { datasource: "tempo", queries: [{ refId: "A", datasource: { type: "tempo", uid: "tempo" }, queryType: "traceql", query: traceId }], range: { from: "now-1h", to: "now" } } };
  return ` &middot; <a target="_blank" href="${info.grafana_url}/explore?schemaVersion=1&orgId=1&panes=${encodeURIComponent(JSON.stringify(panes))}">trace &nearr;</a>`;
}

function add(role, text, meta = "") {
  $("empty")?.remove();
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  if (meta) { const m = document.createElement("span"); m.className = "meta"; m.innerHTML = meta; div.appendChild(m); }
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
}

async function loadInfo() {
  try {
    info = await (await fetch("/info")).json();
    $("chips").innerHTML = [
      chip("model", info.model),
      chip("class", info.model_class),
      chip("API", info.api),
      chip("history", info.history_backend),
      chip("tools", info.tools.length ? info.tools.join(", ") : "none"),
      chip("telemetry", info.telemetry ? "on" : "off"),
      chip("served by", info.served_by),
    ].join("");
  } catch { $("chips").innerHTML = chip("agent", "unreachable"); }
}

async function loadConversation() {
  $("cid").textContent = cid;
  const turns = await (await fetch(`/conversations/${cid}`)).json();
  for (const t of turns) add(t.role, t.role === "tool" ? `tool ${t.text}` : t.text);
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = $("input").value.trim();
  if (!message) return;
  $("input").value = ""; $("send").disabled = true;
  add("user", message);
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message, conversation_id: cid }) });
    const data = await res.json();
    if (!res.ok) { add("error", `${data.error || res.statusText}\n${data.detail || ""}`, `model ${data.model || ""}${traceLink(data.trace_id)}`); return; }
    for (const name of data.tools_called) add("tool", `tool ${name}()`);
    add("assistant", data.reply, `${data.seconds}s &middot; ${data.usage.input_tokens} in / ${data.usage.output_tokens} out tokens &middot; ${data.api} &middot; served by ${data.served_by}${traceLink(data.trace_id)}`);
  } catch (err) { add("error", `Request failed: ${err}`); }
  finally { $("send").disabled = false; $("input").focus(); }
});

$("new").addEventListener("click", () => { cid = newId(); $("log").innerHTML = ""; $("cid").textContent = cid; });

loadInfo().then(loadConversation);
</script>
</body>
</html>
