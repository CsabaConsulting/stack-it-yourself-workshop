# Compose `agent` service -> Deployment + NodePort Service.
# The image is byte-for-byte the one Compose ran. Scale it with:
#   kubectl -n stack-it-yourself scale deployment/agent --replicas=3
# Replies then come from different pods (see "served by" in the UI), while the conversation
# stays coherent - because history lives in Redis, not in the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels: { app: agent }
spec:
  replicas: 1
  selector:
    matchLabels: { app: agent }
  template:
    metadata:
      labels: { app: agent }
    spec:
      containers:
        - name: agent
          image: workshop/agent
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - { name: OTEL_SERVICE_NAME, value: agent }
          envFrom:
            - configMapRef: { name: agent-config }
            - secretRef: { name: agent-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: agent
spec:
  type: NodePort
  selector: { app: agent }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080   # -> http://localhost:8081 via kind-cluster.yaml
